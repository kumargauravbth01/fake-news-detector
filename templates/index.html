<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header p {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }
        textarea {
            width: 100%;
            height: 160px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
            font-size: 0.95rem;
            color: #1e293b;
            resize: none;
            outline: none;
            transition: all 0.2s;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .btn-analyze {
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-analyze:hover {
            background: #1d4ed8;
        }
        .result-box {
            display: none;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            animation: fadeIn 0.3s ease-in;
        }
        .result-real {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
        }
        .result-fake {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        .badge {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .progress-wrapper {
            background: #e2e8f0;
            height: 10px;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0 6px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
        }
        .bar-real { background: #10b981; }
        .bar-fake { background: #ef4444; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h1>🛡️ News Authenticator</h1>
            <p>AI-Powered Misinformation Detection</p>
        </div>

        <textarea id="newsInput" placeholder="Paste article headline or statement here..."></textarea>

        <button class="btn-analyze" id="analyzeBtn" onclick="analyzeNews()">Analyze Content</button>

        <div id="resultBox" class="result-box">
            <div id="resultBadge" class="badge"></div>
            <div class="progress-wrapper">
                <div id="confidenceBar" class="progress-bar"></div>
            </div>
            <span id="confidenceText" style="font-size: 0.85rem; font-weight: 500;"></span>
        </div>
    </div>

    <script>
        async function analyzeNews() {
            const text = document.getElementById('newsInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const badge = document.getElementById('resultBadge');
            const bar = document.getElementById('confidenceBar');
            const confText = document.getElementById('confidenceText');
            const btn = document.getElementById('analyzeBtn');

            if (!text) {
                alert('Please paste some text to analyze.');
                return;
            }

            btn.innerText = "Analyzing...";
            btn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                resultBox.style.display = 'block';
                if (data.prediction === 'REAL') {
                    resultBox.className = 'result-box result-real';
                    badge.innerText = '✅ VERIFIED REAL NEWS';
                    bar.className = 'progress-bar bar-real';
                } else {
                    resultBox.className = 'result-box result-fake';
                    badge.innerText = '🚨 DETECTED AS FAKE';
                    bar.className = 'progress-bar bar-fake';
                }

                bar.style.width = data.confidence + '%';
                confText.innerText = `Model Confidence: ${data.confidence}%`;
            } catch (err) {
                alert('Server connect nahi ho paya. Make sure server.py is running.');
            } finally {
                btn.innerText = "Analyze Content";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
